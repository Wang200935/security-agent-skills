name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
          sudo apt-get update && sudo apt-get install -y shellcheck
      
      - name: Generate catalog
        run: python3 scripts/generate_catalog.py
      
      - name: Check README inventory drift
        run: |
          python3 scripts/generate_readme.py all
          if ! git diff --quiet README*.md; then
            echo "::error::README inventory is stale. Run: python3 scripts/generate_readme.py all"
            git diff README*.md
            exit 1
          fi
      
      - name: Validate skills
        run: python3 scripts/validate.py
      
      - name: Check catalog is up to date
        run: |
          if ! git diff --exit-code catalog.yaml; then
            echo "::error::catalog.yaml is stale. Run 'python scripts/generate_catalog.py' and commit."
            exit 1
          fi
      
      - name: ShellCheck install.sh (blocking)
        run: shellcheck install.sh
      
      - name: ShellCheck build.sh (blocking)
        run: |
          if [ -f build.sh ]; then
            shellcheck build.sh
          fi
      
      - name: Check for secrets
        run: |
          ! grep -rE '(sk-[a-zA-Z0-9]{20,}|ghp_[a-zA-Z0-9]{36,}|AKIA[A-Z0-9]{16})' skills/ --include='*.md' || {
            echo "::error::Potential secrets detected in skill files"
            exit 1
          }
      
      - name: Check for empty reference files (blocking)
        run: |
          found=0
          while IFS= read -r f; do
            echo "::error file=$f::Empty reference file (0 bytes)"
            found=1
          done < <(find skills/ -name '*.md' -size 0 -print)
          if [ "$found" -eq 1 ]; then
            exit 1
          fi

      - name: Installer smoke test — dry-run
        run: |
          chmod +x install.sh
          ./install.sh --agent claude-code --dry-run 2>&1 | head -50

      - name: Installer smoke test — selective install (--domain)
        run: |
          ./install.sh --agent claude-code --domain ctf --dry-run 2>&1 | grep -q "ctf-" && echo "OK: domain filter working"
