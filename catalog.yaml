- id: rf-multi-protocol-jammer
  path: skills/hardware-iot/rf-multi-protocol-jammer/SKILL.md
  domain: hardware-iot
  description: Build OLED-menu multi-protocol 2.4GHz jammer based on RF Jammer architecture
    (cifertech/rf-jammer). Covers ESP32 + 3×nRF24L01+PA+LNA on shared SPI bus with
    SoftNRF bit-bang driver, 8 jamming modes (WiFi/BLE/BT/VideoTX/RC/Zigbee/nRF24/USB
    Wireless). ALL modes use startConstCarrier (CONT_WAVE + PLL_LOCK + W_TX_PAYLOAD_NOACK
    + REUSE_TX_PL) for continuous carrier+payload flooding — pure ShockBurst fires
